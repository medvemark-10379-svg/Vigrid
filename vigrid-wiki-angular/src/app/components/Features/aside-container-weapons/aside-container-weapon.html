<div [class.hidden]="!isVisibleWeapons_" class="bg-[#1a1614] border-r border-[#ff4500]/10">
    <aside class="w-1/4 p-2 md:p-3 lg:p-5">
        <nav class="flex flex-col gap-2 text-xl md:text-2xl lg:text-4xl font-[Nordvik]">
            @for (weapon of (weapon$ | async); track weapon.name) {
            <a class="text-[#ff4500] hover:underline hover:scale-110 transition-all duration-600 ease-in-out hover:pl-2 cursor-pointer" (click)="selectWeapon(weapon.name)">{{ weapon.name }}</a>
            }
        </nav>
    </aside>
</div>
