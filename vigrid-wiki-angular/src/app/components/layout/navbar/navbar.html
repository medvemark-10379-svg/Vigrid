<nav
    class="flex border-b-2 border-[#ff4500]/20 flex items-center p-0 md:p-1 lg:p-2 md:mb-6 lg:mb-8 bg-[#1a1614] text-[#d1c7c0] rounded-b-xl">
    <figure class="hidden md:block w-10 md:w-15 lg:w-20 ml-8 md:ml-15 lg:ml-20 ">
        <img src="exe_Icon.png" alt="Vigrid Game Logo" (click)="refreshPage()"
            class="scale-90 transition-all duration-500 hover:scale-110 hover:brightness-125 hover:cursor-pointer">
    </figure>
    <h2
        class="justify-self-start text-2xl md:text-3xl lg:text-5xl font-bold pl-6 md:pl-8 lg:pl-10 font-[Nordvik] text-[#ff4500]">
        Vigrid<span class="hidden lg:visible lg:inline">: Survive the Ragnarök</span>
    </h2>
    <div class="search_container flex flex-col relative ml-auto">
        <input #searchInput
            class="w-45 py-1 md:w-65 lg:w-85 border border-[#ff4500]/30 rounded-sm m-2 md:pl-3 lg:pl-5 text-xl md:text-xl lg:text-2xl pl-3 mr-6 bg-[#0d0d0d] text-[#d1c7c0] placeholder:text-[#d1c7c0]/50 placeholder:font-[Nordvik] focus:outline-none focus:border-[#ff4500]"
            type="text" placeholder="Search for..." (input)="onSearch($event)"
            (keydown)="onKeyDown($event, searchInput)">
        @if (isDropdownOpen && filteredResults.length > 0) {
        <ul
            class="absolute top-full left-2 right-6 bg-[#1a1614] border-2 rounded-sm border-[#ff4500]/30 shadow-2xl z-50 mt-[-8px] rounded-b-sm">
            @for (name of filteredResults; track name ;let i = $index) {
            <li (click)="itemSelected(name, searchInput)" [class.bg-[#e67e22]]="i === focusedIndex"
                ]="i === focusedIndex"
                class="px-4 py-2 hover:bg-[#e67e22] hover:text-[#0d0d0d] cursor-pointer text-lg md:text-xl font-[Nordvik] border-b border-[#ff4500]/10 last:border-none">
                {{ name }}
            </li>
            }
        </ul>
        }
    </div>
</nav>
